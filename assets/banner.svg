<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient><filter id="blur-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="40"/></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.6}50%{transform:translateY(-15px) scale(1.1);opacity:.9}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}.particle{animation:floatParticle 6s ease-in-out infinite}.pulse{animation:pulseGlow 8s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:10,10;animation:dashLine 3s linear infinite}.pill-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:500;fill:#cbd5e1}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g filter="url(#blur-glow)"><circle cx="200" cy="100" r="180" fill="#4f46e5" class="pulse"/><circle cx="1000" cy="300" r="200" fill="#9333ea" class="pulse" style="animation-delay:-4s"/><circle cx="600" cy="200" r="150" fill="#2563eb" class="pulse" style="animation-delay:-2s"/></g><g stroke="#fff" stroke-opacity=".05" stroke-width="1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x