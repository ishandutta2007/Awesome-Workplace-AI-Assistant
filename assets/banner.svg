<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.9; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .pulse { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 10, 10; animation: dashLine 3s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #cbd5e1; }
    .pill-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Dynamic Glowing Blobs -->
  <g filter="url(#blur-glow)">
    <circle cx="200" cy="100" r="180" fill="#4f46e5" class="pulse" />
    <circle cx="1000" cy="300" r="200" fill="#9333ea" class="pulse" style="animation-delay: -4s;" />
    <circle cx="600" cy="200" r="150" fill="#2563eb" class="pulse" style="animation-delay: -2s;" />
  </g>

  <!-- Background Dynamic Grid & Flow Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>
  <path d="M 50 350 Q 300 280 600 350 T 1150 280" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="flow-line" opacity="0.5"/>
  <path d="M 50 50 Q 400 120 700 50 T 1150 120" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" opacity="0.4" style="animation-duration: 5s;"/>

  <!-- Background Floating Network Nodes / Particles -->
  <g opacity="0.7">
    <circle cx="150" cy="280" r="5" fill="#818cf8" class="particle" style="animation-delay: 0s;"/>
    <circle cx="1050" cy="120" r="6" fill="#c084fc" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="920" cy="320" r="4" fill="#38bdf8" class="particle" style="animation-delay: 3s;"/>
    <circle cx="280" cy="100" r="4.5" fill="#f472b6" class="particle" style="animation-delay: 2s;"/>
  </g>

  <!-- Foreground Main Card Container -->
  <rect x="80" y="45" width="1040" height="310" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="url(#accent-grad)" stroke-width="1.5" />

  <!-- Foreground Title Header -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="470" y="75" width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="96" class="pill-text" text-anchor="middle">🤖 ENTERPRISE AI ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="600" y="165" class="title-text" font-size="44" letter-spacing="-0.5">Awesome Workplace AI Assistant</text>
    
    <!-- Accent Line -->
    <rect x="450" y="185" width="300" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="600" y="225" class="subtitle-text" font-size="20">Top SaaS Platforms &amp; Open-Source AI Copilots</text>
    <text x="600" y="255" class="subtitle-text" font-size="15" fill="#94a3b8">Enterprise Q&amp;A • Knowledge Search • Agentic Workflows • Multi-LLM RAG</text>
  </g>

  <!-- Feature Badge Pills at Bottom of Foreground Card -->
  <g transform="translate(180, 285)">
    <!-- Pill 1: SaaS Leaders -->
    <rect x="0" y="0" width="240" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="24" class="pill-text" text-anchor="middle">🏢 Enterprise SaaS Leaders</text>

    <!-- Pill 2: Open Source -->
    <rect x="270" y="0" width="240" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="390" y="24" class="pill-text" text-anchor="middle">⚡ 100% Sovereign &amp; OSS</text>

    <!-- Pill 3: Autonomous Agents -->
    <rect x="540" y="0" width="300" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="690" y="24" class="pill-text" text-anchor="middle">🧠 Autonomous Knowledge Agents</text>
  </g>
</svg>
